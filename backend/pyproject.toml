[project]
name = "daily-utils-local"
version = "0.1.0"
description = "Local asynchronous processing API for Daily Utils"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28,<1",
    "pillow>=11,<13",
    "pymupdf>=1.24,<2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
mlx = [
    "jinja2>=3.1.6",
    "mlx-vlm==0.4.2",
    "openai>=3.7.0",
    "torch==2.7.0",
    "torchaudio==2.7.0",
    "torchvision==0.22.0",
]

[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "Linux"
extraPaths = []
include = []
reportMissingImports = "error"
reportMissingModuleSource = false
